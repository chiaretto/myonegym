<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1115" />
  <title>MyOneGym — Sessões (novo design)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/session.css" />
  <link rel="stylesheet" href="css/mockup.css" />
</head>
<body class="mock">

<p class="mock-tag"><a href="index.html">← galeria</a> · <b>Sessões</b> · rota <code>/sessions</code></p>

<div class="app">
  <div class="mock-statusbar">
    <span>21:45</span>
    <span class="right"><i class="ti ti-bluetooth"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i> 64%</span>
  </div>

  <header class="appbar">
    <h1>Sessões</h1>
    <span class="spacer"></span>
    <button class="chip accent" aria-label="Trocar academia ativa">
      <i class="png-ic pi-building"></i> Fit Park <i class="png-ic pi-chevron-down"></i>
    </button>
  </header>

  <main class="screen">
    <div class="context-strip">
      <span class="count-hint">12 sessões nesta academia</span>
    </div>

    <div class="month-label">Julho 2026</div>
    <ul class="session-list">
      <li>
        <button class="session-card">
          <div class="session-info">
            <div class="session-name">Dia 1 – Peito e Tríceps</div>
            <div class="session-sub">hoje, 21:52 · 4 exercícios</div>
          </div>
          <span class="done-badge full"><i class="ti ti-check" style="font-size:.85em"></i> 4/4</span>
        </button>
      </li>
      <li>
        <button class="session-card">
          <div class="session-info">
            <div class="session-name">Dia 5 – Ombros, Peito e Trapézio</div>
            <div class="session-sub">ontem, 20:14 · 5 exercícios</div>
          </div>
          <span class="done-badge">4/5</span>
        </button>
      </li>
      <li>
        <button class="session-card">
          <div class="session-info">
            <div class="session-name">Dia 4 – Pernas (Posterior e Glúteo)</div>
            <div class="session-sub">22 de jul, 19:40 · 6 exercícios</div>
          </div>
          <span class="done-badge full"><i class="ti ti-check" style="font-size:.85em"></i> 6/6</span>
        </button>
      </li>
      <li>
        <button class="session-card">
          <div class="session-info">
            <div class="session-name">Dia 3 – Costas e Bíceps</div>
            <div class="session-sub">20 de jul, 21:03 · 5 exercícios</div>
          </div>
          <span class="done-badge">3/5</span>
        </button>
      </li>
    </ul>

    <div class="month-label">Junho 2026</div>
    <ul class="session-list">
      <li>
        <button class="session-card">
          <div class="session-info">
            <div class="session-name">Dia 2 – Core e Panturrilha</div>
            <div class="session-sub">28 de jun, 07:12 · 5 exercícios</div>
          </div>
          <span class="done-badge full"><i class="ti ti-check" style="font-size:.85em"></i> 5/5</span>
        </button>
      </li>
    </ul>
  </main>

  <nav class="tabbar">
    <a href="home.html"><i class="png-ic pi-home"></i>Treinos</a>
    <a href="session-history.html" class="active"><i class="png-ic pi-history"></i>Sessões</a>
    <a href="settings.html"><i class="png-ic pi-settings"></i>Configurações</a>
  </nav>
</div>

</body>
</html>
