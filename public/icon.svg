<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "OneGym Red" app icon. Dark tile per brand.html's chosen variant, with the
       accent on the outer plates so the mark reads as branded at 48px, where a
       white-on-dark dumbbell alone is indistinguishable from any gym app.
       Palette mirrors tokens.css: #14171d = --surface-2, #ec2c2e = --accent. -->
  <rect width="512" height="512" rx="112" fill="#14171D"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <line x1="150" y1="256" x2="362" y2="256" stroke="#FFFFFF" stroke-width="26"/>
    <rect x="96" y="206" width="46" height="100" rx="14" fill="#FFFFFF"/>
    <rect x="370" y="206" width="46" height="100" rx="14" fill="#FFFFFF"/>
    <rect x="60" y="226" width="34" height="60" rx="12" fill="#EC2C2E"/>
    <rect x="418" y="226" width="34" height="60" rx="12" fill="#EC2C2E"/>
  </g>
</svg>
